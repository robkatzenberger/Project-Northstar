[package]
name = "tlpx"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Northstar TL-PX 0.2 local authority MVP"
publish = false
rust-version = "1.70"

[dependencies]
getrandom = "0.3"
hmac = "0.12"
nix = { version = "0.30", features = ["fs", "process", "signal", "socket", "user"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "tlpx"
path = "src/lib.rs"
